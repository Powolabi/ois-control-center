version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ois-control-center-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oisadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-ois_control_center}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oisadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
